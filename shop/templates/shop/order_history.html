{% extends 'shop/base.html' %}
{% block content %}
<div class="container mt-5">
    <h1>My Order History</h1>
    {% if orders %}
        {% for order in orders %}
            <div class="card mb-3 shadow-sm"><div class="card-body">
                <h5>Order #{{ order.id }}</h5>
                <p>Date: {{ order.created_at }}<br>Total: ${{ order.total_price }}</p>
            </div></div>
        {% endfor %}
    {% else %}<p>You haven't placed any orders yet.</p>{% endif %}
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Back to Store</a>
</div>
{% endblock %}
