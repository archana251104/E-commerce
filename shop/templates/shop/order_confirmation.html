<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Order Confirmed!</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .success-box { border: 2px solid #28a745; padding: 20px; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="success-box">
        <h1 style="color: #28a745;">Thank you for your order!</h1>
        <h2>Order #{{ order.id }}</h2>
        <p>Total Paid: <strong>${{ order.total_price }}</strong></p>
        <a href="{% url 'product_list' %}">Back to Store</a>
    </div>
</body>
</html>
