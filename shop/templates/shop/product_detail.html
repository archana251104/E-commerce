<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">🛍️ My Store</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h1 class="card-title">{{ product.name }}</h1>
                        <h2 class="text-success my-3">${{ product.price }}</h2>
                        <p class="card-text">{{ product.description }}</p>
                        
                        {% if product.stock > 0 %}
                            <p class="text-success"><strong>In Stock</strong> ({{ product.stock }} available)</p>
                            <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-lg w-100">Add to Cart</a>
                        {% else %}
                            <p class="text-danger"><strong>Out of Stock</strong></p>
                            <button class="btn btn-secondary btn-lg w-100" disabled>Out of Stock</button>
                        {% endif %}
                        
                        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary mt-3 w-100">Back to Store</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
