<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ product.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <a href="{% url 'product_list' %}" class="back-link">&larr; Back to Store</a>
    
    <div class="container">
        <h1>{{ product.name }}</h1>
        <h2 style="color: green;">${{ product.price }}</h2>
        <p>{{ product.description }}</p>
        
        {% if product.stock > 0 %}
            <p style="color: green;">In Stock ({{ product.stock }} available)</p>
            
            <!-- This is the Add to Cart Button -->
            <a href="{% url 'add_to_cart' product.id %}" style="display: inline-block; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; text-decoration: none; cursor: pointer;">Add to Cart</a>
            
        {% else %}
            <p style="color: red;">Out of Stock</p>
        {% endif %}
    </div>
</body>
</html>
