{% extends 'shop/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center"><div class="col-md-6"><div class="card shadow"><div class="card-body text-center">
        <h1 class="card-title">{{ product.name }}</h1>
        <h2 class="text-success my-3">${{ product.price }}</h2>
        <p class="card-text">{{ product.description }}</p>
        {% if product.stock > 0 %}<p class="text-success"><strong>In Stock</strong></p>
            <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-lg w-100">Add to Cart</a>
        {% else %}<p class="text-danger"><strong>Out of Stock</strong></p>{% endif %}
        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary mt-3 w-100">Back to Store</a>
    </div></div></div></div>
</div>
{% endblock %}
