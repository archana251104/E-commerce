{% extends 'shop/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm p-4 rounded-4">
        
        <div class="text-center mb-4">
            <div style="width: 100px; height: 100px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 3rem; color: #6c757d;">
                <i class="bi bi-person-fill"></i>
            </div>
            <h3 class="mt-3 fw-bold">{{ user.username }}</h3>
            <p class="text-muted">{{ user.email }}</p>
        </div>

        <hr>

        <div class="row text-center">
            <div class="col-6 border-end">
                <h5 class="fw-bold">Member Since</h5>
                <p class="text-muted">{{ user.date_joined|date:"F j, Y" }}</p>
            </div>
            <div class="col-6">
                <h5 class="fw-bold">Total Orders</h5>
                <p class="text-muted">{{ user.order_set.count }}</p>
            </div>
        </div>

        <hr>

        <div class="d-grid gap-2 mt-3">
            <a href="{% url 'order_history' %}" class="btn btn-primary rounded-pill py-2">View My Orders</a>
            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary rounded-pill py-2">Continue Shopping</a>
        </div>

    </div>
</div>
{% endblock %}
